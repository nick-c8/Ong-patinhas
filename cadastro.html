<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quero Ajudar - ONG Patinhas</title>
</head>

<body>

    <header>
        <h1>ONG Patinhas 🐾</h1>

        <nav>
            <a href="index.html">Início</a> |
            <a href="projetos.html">Projetos</a> |
            <a href="cadastro.html">Quero Ajudar</a>
        </nav>
    </header>

    <main>
        <h2>Cadastre-se para ajudar</h2>

        <p>
            Preencha o formulário abaixo para fazer parte da ONG Patinhas.
        </p>

        <form action="#" method="post">

            <fieldset>
                <legend>Dados pessoais</legend>

                <label for="nome">Nome completo:</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    required
                    minlength="3"
                    maxlength="100"
                >
                <br><br>

                <label for="email">E-mail:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
                <br><br>

                <label for="cpf">CPF:</label>
                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    placeholder="000.000.000-00"
                    pattern="[0-9]{3}.[0-9]{3}.[0-9]{3}-[0-9]{2}"
                    maxlength="14"
                    required
                >
                <br><br>

                <label for="telefone">Telefone:</label>
<input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(00) 00000-0000"
                    pattern="([0-9]{2}) [0-9]{5}-[0-9]{4}"
                    maxlength="15"
                    required
                >
                <br><br>

                <label for="nascimento">Data de nascimento:</label>
                <input
                    type="date"
                    id="nascimento"
                    name="nascimento"
                    required
                >
            </fieldset>

            <br>

            <fieldset>
                <legend>Endereço</legend>

                <label for="cep">CEP:</label>
                <input
                    type="text"
                    id="cep"
                    name="cep"
                    placeholder="00000-000"
                    pattern="[0-9]{5}-[0-9]{3}"
                    maxlength="9"
                    required
                >
                <br><br>
<label for="endereco">Endereço:</label>
                <input
                    type="text"
                    id="endereco"
                    name="endereco"
                    required
                >
                <br><br>

                <label for="numero">Número:</label>
                <input
                    type="number"
                    id="numero"
                    name="numero"
                    min="1"
                    required
                >
                <br><br>

                <label for="cidade">Cidade:</label>
                <input
                    type="text"
                    id="cidade"
                    name="cidade"
                    required
                >
                <br><br>

                <label for="estado">Estado:</label>
                <select id="estado" name="estado" required>
                    <option value="">Selecione</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="BA">Bahia</option>
                    <option value="PR">Paraná</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="RS">Rio Grande do Sul</option>
                </select>
            </fieldset>

            <br>

            <fieldset>
                <legend>Como você deseja ajudar?</legend>

                <label for="ajuda">Área de interesse:</label>

                <select id="ajuda" name="ajuda" required>
                    <option value="">Selecione</option>
                    <option value="resgate">Resgate de animais</option>
                    <option value="lar-temporario">Lar temporário</option>
                    <option value="adocao">Adoção responsável</option>
                    <option value="doacao">Doação</option>
                    <option value="eventos">Eventos e campanhas</option>
                </select>

                <br><br>
                <label for="disponibilidade">Disponibilidade:</label>
                <select id="disponibilidade" name="disponibilidade" required>
                    <option value="">Selecione</option>
                    <option value="semana">Durante a semana</option>
                    <option value="fim-semana">Finais de semana</option>
                    <option value="ambos">Semana e finais de semana</option>
                </select>

                <br><br>

                <label for="mensagem">Conte um pouco sobre você:</label>
                <br>
                <textarea
                    id="mensagem"
                    name="mensagem"
                    rows="5"
                    cols="40"
                    maxlength="500"
                    placeholder="Como você gostaria de contribuir?"
                ></textarea>
            </fieldset>

            <br>

            <label>
                <input type="checkbox" name="termos" required>
                Aceito participar como colaborador da ONG Patinhas.
            </label>

            <br><br>

            <button type="submit">Quero ajudar!</button>
            <button type="reset">Limpar formulário</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 ONG Patinhas.</p>
    </footer>

</body>
</html>
